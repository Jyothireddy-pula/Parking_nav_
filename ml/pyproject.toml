[project]
name = "parkingnavx-ml"
version = "0.1.0"
description = "ParkingNav-X computer vision occupancy detection (Module 5)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pillow>=10.0,<12",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.setuptools.packages.find]
include = ["cv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
