# VIT-AP — MIXED PROVENANCE, READ THIS BEFORE EDITING.
#
# destinations: REAL NAMES, REAL COORDINATES. Pulled live from the
# OpenStreetMap Overpass API on 2026-09-13 (see
# configs/campuses/vitap/real_survey/osm_reference/). provenance:
# EXTERNAL_MAP_REFERENCE — real, but not yet GPS-walk/satellite-verified
# (Module 1B Steps 2-3 still haven't happened).
#
# gates, parking_lots, roads: FABRICATED PLACEHOLDERS, provenance: SAMPLE.
# VIT-AP has no gate or parking-lot data in any real source yet (OSM has
# zero of either for this campus, and capacity can never come from a map
# source anyway), and no real road/path connects these buildings without
# inventing adjacency (see osm_reference/README.md). These entries exist
# only so this campus is loadable and routable for development/testing —
# a single placeholder gate and lot, connected to every real destination
# by a straight line (NOT a walked path — see each road's name and the
# note below). Road `length` is the real haversine distance between real
# endpoints; `expected_travel_time` is a rough walking-speed estimate
# (1.3 m/s), not a measurement.
#
# None of this replaces Module 1B's physical GPS walk. When that happens,
# replace every SAMPLE gate/lot/road below with REAL ones from
# gps_survey_to_config.py, and re-verify the destinations against
# satellite view before flipping their provenance to REAL.

