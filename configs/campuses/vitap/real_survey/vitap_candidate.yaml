# VIT-AP — REAL DATA, NOT YET LOADABLE. Do not copy this into
# configs/campuses/vitap.yaml or run load_campus_config.py against it.
#
# Every coordinate and name below is real: pulled from the live Overpass
# API against OpenStreetMap on 2026-09-13 (see osm_reference/), not typed
# in or estimated. Every entity is honestly labeled provenance:
# EXTERNAL_MAP_REFERENCE — real, but not yet GPS-walk/satellite-verified
# (Module 1B Steps 2-3).
#
# This file intentionally has no gates, no parking_lots, and no roads:
# OSM has zero gates for this campus, zero named/capacitied parking
# lots (capacity can never come from a map source anyway — see
# app/models/provenance.py), and while ~100 road/path ways exist in the
# OSM pull, none of them reliably connect two of these named buildings
# without approximating adjacency — see osm_reference/README.md for the
# one weak candidate found (MH-2 <-> MH-2 Food Store, ~22-29m away at
# each end) and why it wasn't used here. Inventing a connection to make
# this pass Module 1's orphan-node check would be exactly the kind of
# fabrication this project's rules forbid.
#
# Loading this as-is through Module 1's real loader will correctly FAIL
# with an orphan-node error for every destination below — see
# backend/tests/test_vitap_candidate_config.py, which asserts that
# failure on purpose. That failure is the honest, current status: real
# names and real coordinates exist, but the campus isn't walkable/
# connected/capacitied yet. The physical GPS walk (Module 1B Steps 2-3)
# is what turns this into a real, loadable, REAL-provenance config —
# see real_survey/README.md for what that walk still needs to capture.

